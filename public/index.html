<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="conferidor-guias" content="1">
<meta name="color-scheme" content="light dark">
<title>Conferidor de Guias · Promédica</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
/* Tema aplicado antes da pintura, para não piscar. Preferência guardada neste computador. */
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('conferidor.tema') || '"auto"');
    var escuro = t === 'escuro' || (t !== 'claro' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
  } catch (e) { }
})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topo">
  <div class="wrap topo-in">
    <div class="marca">
      <img class="logo" src="logo-promedica.png" alt="Promédica">
      <span class="div"></span>
      <div>
        <h1>Conferidor de Guias</h1>
        <p class="sub">Núcleo Gestão de Terapias</p>
      </div>
    </div>
    <div class="progs" id="topoProg"></div>
    <div class="topo-acoes" id="topoAcoes"></div>
  </div>
</header>
<div class="wrap">
  <nav class="abas" id="abas" aria-label="Seções"></nav>
</div>
<div class="wrap print-wrap"><div class="print-head"><img src="logo-promedica.png" alt="Promédica"><b>Conferidor de Guias · <span>Núcleo Gestão de Terapias</span></b><small id="printData"></small></div></div>
<div id="barraSync" class="barra-sync" hidden role="alert"></div>
<main id="app"></main>
<footer class="rodape">
  <span>© <span id="anoRodape"></span> Promédica · Conferidor de Guias<span class="ver" id="verRodape" title="Versão do sistema"></span></span>
  <span>Criado por <b>Alexandre Neves</b></span>
</footer>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="arquivoEml" accept=".eml,message/rfc822" class="oculto">

<script src="js/01-base.js"></script>

</html>
