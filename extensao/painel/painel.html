<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Conferidor de Guias · Promédica</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="tema.js"></script>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/inter-latin-wght-normal.woff2") format("woff2-variations"),url("fonts/inter-latin-wght-normal.woff2") format("woff2")}
:root{
  /* Tipografia */
  --font-sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:19px; --fs-2xl:22px;
  --lh:1.5;
  /* Espaçamento e forma */
  --r-sm:8px; --r:12px; --r-lg:16px; --h-ctl:34px; --h-sm:28px;
  /* Marca (paleta Promédica) */
  --brand-50:#f2f6fb; --brand-100:#e1eaf4; --brand-200:#c5d5e8; --brand-300:#9bb6d5; --brand-400:#6a90bd; --brand-500:#4872a4;
  --brand-600:#375b88; --brand-700:#2c4a70; --brand-800:#233c5c; --brand-900:#1e3350; --brand-950:#13223a;
  --accent-50:#effaf8; --accent-100:#d3f0ea; --accent-200:#a7e0d5; --accent-300:#6fc9b9; --accent-400:#3aae9c; --accent-500:#1f9282;
  --accent-600:#17786b; --accent-700:#155f56; --accent-800:#144d47; --accent-900:#12403b;
  /* Tokens semânticos (tema claro) */
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --border:#e2e8f0; --border-strong:#cbd5e1; --grid:#0f172a;
  --text:#1c2431; --text-2:#566174; --text-3:#7b8596;
  --primary:#2c4a70; --primary-hover:#233c5c; --primary-press:#1e3350; --on-primary:#ffffff;
  --soft:#f2f6fb; --soft-2:#e1eaf4; --soft-br:#c5d5e8; --soft-fg:#233c5c;
  --accent:#17786b; --accent-bg:#effaf8; --accent-br:#a7e0d5; --accent-fg:#155f56;
  --focus:#1f9282; --field:#ffffff; --th:#1d4f91; --on-th:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --ok-bg:#ecfdf5; --ok-fg:#166534; --ok-br:#86efac; --ok-solid:#16a34a;
  --warn-bg:#fffbeb; --warn-fg:#78350f; --warn-br:#fcd34d; --warn-solid:#d97706;
  --bad-bg:#fef2f2; --bad-fg:#7f1d1d; --bad-br:#fca5a5; --bad-solid:#dc2626;
  --obs-bg:#f5f3ff; --obs-fg:#4c1d95; --obs-br:#c4b5fd; --obs-solid:#7c3aed;
  --info-bg:#eff6ff; --info-fg:#1e3a8a; --info-br:#bfdbfe; --info-solid:#2563eb;
  --neu-bg:#f1f5f9; --neu-fg:#334155; --neu-br:#e2e8f0;
  --mark-ok:#bbf7d0; --mark-warn:#fde68a; --mark-cart:#dbeafe;
  --overlay:rgba(8,15,30,.62);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0e1420; --surface:#151c2a; --surface-2:#1a2333; --surface-3:#212c40;
  --border:#2a3550; --border-strong:#3a4966; --grid:#3d4b68;
  --text:#e7ebf3; --text-2:#a6b1c4; --text-3:#7f8ba0;
  --primary:#3d6cab; --primary-hover:#4a7bbd; --primary-press:#355f9a; --on-primary:#ffffff;
  --soft:#1b2a42; --soft-2:#243652; --soft-br:#37507a; --soft-fg:#d3e2f6;
  --accent:#3aae9c; --accent-bg:#11302d; --accent-br:#1f5e55; --accent-fg:#8fe0d2;
  --focus:#4cc2ae; --field:#111826; --th:#1f4a82; --on-th:#f4f8ff; --shadow:0 1px 2px rgba(0,0,0,.4);
  --ok-bg:#10301f; --ok-fg:#86efac; --ok-br:#1f6b3a; --ok-solid:#22c55e;
  --warn-bg:#32280a; --warn-fg:#fcd34d; --warn-br:#7a5c0a; --warn-solid:#f59e0b;
  --bad-bg:#3a1515; --bad-fg:#fca5a5; --bad-br:#7f2a2a; --bad-solid:#ef4444;
  --obs-bg:#292049; --obs-fg:#c4b5fd; --obs-br:#5b46a0; --obs-solid:#8b5cf6;
  --info-bg:#142849; --info-fg:#93c5fd; --info-br:#2a4f8a; --info-solid:#60a5fa;
  --neu-bg:#212c40; --neu-fg:#cbd5e1; --neu-br:#3a4966;
  --mark-ok:#14532d; --mark-warn:#5b4410; --mark-cart:#1e3a6e;
  --overlay:rgba(0,0,0,.72);
  color-scheme:dark;
}
/* Cores de identificação (operadores e clínicas). Evitam vermelho e âmbar, reservados a alertas. */
.idc-0{--c-h:215}.idc-1{--c-h:190}.idc-2{--c-h:172}.idc-3{--c-h:145}.idc-4{--c-h:95}
.idc-5{--c-h:245}.idc-6{--c-h:272}.idc-7{--c-h:300}.idc-8{--c-h:332}.idc-9{--c-h:24}
.idc{--c-bg:hsl(var(--c-h) 70% 92%);--c-fg:hsl(var(--c-h) 60% 26%);--c-br:hsl(var(--c-h) 50% 72%);--c-solid:hsl(var(--c-h) 55% 42%)}
:root[data-theme=dark] .idc{--c-bg:hsl(var(--c-h) 38% 22%);--c-fg:hsl(var(--c-h) 75% 82%);--c-br:hsl(var(--c-h) 35% 40%);--c-solid:hsl(var(--c-h) 60% 62%)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-md)/var(--lh) var(--font-sans);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--text-2)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
.wrap{width:100%;max-width:1600px;margin:0 auto;padding:0 12px}
@media (min-width:640px){.wrap{padding:0 24px}}

/* Ícones */
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}.ic.lg{width:20px;height:20px}.ic.xl{width:28px;height:28px}
@keyframes giro{to{transform:rotate(360deg)}}

/* ===== Topo ===== */
header.topo{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:0;z-index:30}
.topo-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-top:10px;padding-bottom:10px}
.marca{display:flex;align-items:center;min-width:0}
.marca .logo{height:40px;width:auto;display:block}
:root[data-theme=dark] .marca .logo{filter:brightness(1.25) contrast(1.05)}
.marca .div{width:1px;height:36px;background:var(--border);margin:0 16px;display:none}
@media (min-width:640px){.marca .div{display:block}}
.marca h1{font-size:var(--fs-xl);font-weight:750;color:var(--soft-fg);letter-spacing:-.015em;line-height:1.2}
.marca .sub{margin-top:2px;font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.topo-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:var(--h-ctl);border-radius:var(--r-sm);padding:0 11px;font-size:var(--fs-sm);font-weight:600;background:var(--surface-2);color:var(--text);border:1px solid var(--border);white-space:nowrap;line-height:1}
.chip.ctx{background:var(--soft);border-color:var(--soft-br);color:var(--soft-fg)}
button.chip{cursor:pointer}
button.chip:hover{background:var(--soft-2)}
button.chip:active{transform:translateY(1px)}
.chip.chip-op{background:var(--c-bg,var(--surface-2));border-color:var(--c-br,var(--border));color:var(--c-fg,var(--text))}
.chip select option{color:var(--text);background:var(--surface)}
.chip select{width:auto;min-width:110px;max-width:170px;border:0;background:transparent;padding:0 2px;font-weight:600;color:inherit;cursor:pointer;min-height:0;box-shadow:none;border-radius:0}
.chip select:focus{outline:none;box-shadow:none}
.chip:focus-within,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.chip.pasta{font-weight:600}
.chip.pasta.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-br)}
.chip.pasta.alerta{background:var(--surface-2);color:var(--warn-fg);border-color:var(--warn-br)}
.chip.pasta.alerta .ic{color:var(--warn-solid)}
:root[data-theme=dark] .chip.pasta.alerta{color:var(--warn-fg)}
.chip.tema{padding:0 10px}
.luz{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border)}
.luz.ok{background:#16a34a}.luz.warn{background:#eab308}.luz.bad{background:#dc2626}
.btn.so{font-size:0;gap:0;padding:0 9px;min-width:var(--h-ctl)}
.btn.sm.so,.btn.cp{min-width:var(--h-sm);padding:0 8px}
.btn.so .ic{font-size:var(--fs-sm)}
.progs{display:none;gap:6px;align-items:center;margin-right:auto;min-width:0}
body.topo-mini .progs{display:flex}
.prog{width:32px;height:32px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:help;background:conic-gradient(var(--c-solid,var(--primary)) calc(var(--p,0)*1%),var(--surface-3) 0)}
.prog::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.prog .pe{position:relative;display:inline-flex;line-height:1}
.prog .emoji{font-size:17px}.prog .ic{color:var(--text-3)}
.barra-webmail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px auto 0;max-width:1600px;padding:8px 12px;background:var(--info-bg);border:1px solid var(--info-br);border-radius:var(--r);width:calc(100% - 24px)}
.barra-webmail[hidden]{display:none}
.barra-webmail .bw-txt{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px}
.chip.mini-btn{padding:0 9px;min-width:var(--h-ctl);justify-content:center}
/* Topo compacto: só operador, luz da pasta e botão de voltar, na cor do operador */
body.topo-mini header.topo{background:linear-gradient(var(--c-bg,transparent),var(--c-bg,transparent)),var(--surface);border-bottom-color:var(--c-br,var(--border));box-shadow:none}
body.topo-mini .marca{display:none}
body.topo-mini .topo-in{padding-top:3px;padding-bottom:3px;justify-content:flex-end;flex-wrap:nowrap}
body.topo-mini .topo-acoes{flex-wrap:nowrap;gap:6px}
body.topo-mini .chip{min-height:28px;padding:0 8px}
body.topo-mini .chip.mini-btn{min-width:28px;padding:0 6px}
body.topo-mini .chip.chip-op{background:transparent;border-color:transparent}
body.topo-mini nav.abas{display:none}
body.topo-mini .chip select{max-width:46vw}
.chip .txt-fino{display:inline}
@media (max-width:560px){
  .chip .txt-fino,nav.abas button .txt-fino{display:none}
  .chip.ctx{padding:0 8px}
  nav.abas{gap:4px;padding:6px}
  nav.abas button{padding:0 12px;flex:1;justify-content:center}
  .topo-in{padding-top:6px;padding-bottom:6px;gap:6px 10px}
  .marca .logo{height:30px}
  .marca h1{font-size:var(--fs-lg)}
  .marca .sub{font-size:10px;letter-spacing:.06em}
  .topo-acoes{gap:5px;width:100%;justify-content:flex-end}
  .chip select{min-width:80px;max-width:36vw}
}
.avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c-bg,var(--surface-3));color:var(--c-fg,var(--text-2));border:1px solid var(--c-br,var(--border))}
.avatar .emoji{font-size:18px;line-height:1}.avatar.lg .emoji{font-size:29px}.tag .emoji{font-size:15px;line-height:1}.av-op .emoji{font-size:27px;line-height:1}
.avatar.lg{width:44px;height:44px}.avatar.lg .ic{width:19px;height:19px}
.sq{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;border-radius:6px;background:var(--c-bg);color:var(--c-fg);border:1px solid var(--c-br);font-size:10.5px;font-weight:750;letter-spacing:.02em}
.sq.lg{width:34px;height:34px;font-size:13px;border-radius:9px}

/* ===== Abas e etapas ===== */
nav.abas{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;margin:12px 0 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
nav.abas button{display:inline-flex;align-items:center;gap:7px;min-height:var(--h-ctl);border:1px solid transparent;background:var(--soft);color:var(--soft-fg);padding:0 14px;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:background .12s}
nav.abas button:hover{background:var(--soft-2)}
nav.abas button:active{transform:translateY(1px)}
nav.abas button.ativo{background:var(--primary);color:var(--on-primary)}
nav.abas button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{width:100%;max-width:1600px;margin:0 auto;padding:12px 12px 28px;flex:1}
@media (min-width:640px){main{padding:12px 24px 28px}}
main > * + *{margin-top:10px}

.guias-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.guia-tab{display:flex;align-items:center;gap:9px;flex:none;min-width:190px;max-width:290px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:8px 12px;cursor:pointer;box-shadow:var(--shadow)}
.guia-tab:hover{border-color:var(--border-strong);background:var(--surface-2)}
.guia-tab.ativa{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.guia-tab .t1{font-size:var(--fs-sm);font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.guia-tab .t2{font-size:var(--fs-xs);color:var(--text-2)}
.guia-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.passos{display:flex;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
.passo{flex:1 0 auto;min-width:46px;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;text-align:left;color:var(--text-2)}
@media (min-width:760px){.passo{min-width:170px}}
.passo .bola{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:var(--fs-xs);font-weight:700;border:2px solid var(--border-strong);color:var(--text-2);background:var(--surface)}
.passo .tx{display:none;min-width:0}
@media (min-width:760px){.passo .tx{display:block}}
.passo .tx small{display:block;font-size:var(--fs-xs);line-height:1.2}
.passo .tx b{display:block;font-size:var(--fs-sm);font-weight:650;color:var(--text);line-height:1.3}
.passo:hover:not(:disabled){background:var(--surface-2)}
.passo:disabled{cursor:not-allowed;opacity:.55}
.passo.atual{background:var(--soft);border-color:var(--soft-br)}
.passo.atual .bola{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.passo.feito .bola{background:var(--ok-solid);border-color:var(--ok-solid);color:#fff}
.passo.atencao .bola{background:var(--warn-bg);border-color:var(--warn-solid);color:var(--warn-fg)}
.passo.atencao .tx small{color:var(--warn-fg);font-weight:650}
.passo:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ===== Cartões ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:8px}
.card-h h2{font-size:var(--fs-lg);font-weight:700;color:var(--soft-fg);letter-spacing:-.005em}
.card-h .esp{flex:1}
.card h3,.sec-t{font-size:var(--fs-md);font-weight:650;color:var(--soft-fg);margin:12px 0 6px}
.eyebrow{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dica{color:var(--text-2);font-size:var(--fs-xs);margin:0 0 6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:start}
.grid2 > div > .card + .card{margin-top:12px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.stack > * + *{margin-top:10px}
.linha-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.acoes .esp{flex:1}

/* ===== Botões ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--h-ctl);padding:0 14px;border:1px solid var(--soft-br);background:var(--soft);color:var(--soft-fg);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s;user-select:none;text-decoration:none}
.btn:hover{background:var(--soft-2)}
.btn:active{transform:translateY(1px);filter:brightness(.97)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.42;cursor:not-allowed;transform:none;filter:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.pri:active{background:var(--primary-press)}
.btn.line{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn.line:hover{background:var(--surface-3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.dng{background:transparent;border-color:var(--bad-br);color:var(--bad-fg)}
.btn.dng:hover{background:var(--bad-bg)}
:root[data-theme=light] .btn.dng{color:#b91c1c}
.btn.cp{background:var(--accent-bg);border-color:var(--accent-br);color:var(--accent-fg);min-height:var(--h-sm);padding:0 10px;font-size:var(--fs-xs)}
.btn.cp:hover{background:var(--accent-br)}
:root[data-theme=dark] .btn.cp:hover{background:#17463f}
.btn.cp.copiado{background:var(--ok-bg);border-color:var(--ok-br);color:var(--ok-fg)}
.btn.sm{min-height:var(--h-sm);padding:0 10px;font-size:var(--fs-xs)}
.btn.ico{padding:0;width:var(--h-ctl)}
.btn.sm.ico{width:var(--h-sm)}
.btn.carregando{position:relative;pointer-events:none;color:transparent!important}
.btn.carregando::after{content:"";position:absolute;width:15px;height:15px;border:2px solid var(--text-2);border-top-color:transparent;border-radius:50%;animation:giro .7s linear infinite}
.btn.pri.carregando::after{border-color:var(--on-primary);border-top-color:transparent}

/* ===== Campos ===== */
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],select,textarea{width:100%;min-height:var(--h-ctl);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:6px 10px;background:var(--field);color:var(--text);font-size:var(--fs-md)}
select{padding-right:6px;cursor:pointer}
textarea{line-height:1.5;resize:vertical;font-size:var(--fs-md)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--text-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed;background:var(--surface-2)}
input.invalido,select.invalido{border-color:var(--bad-solid);box-shadow:0 0 0 1px var(--bad-solid)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:0;accent-color:var(--primary);margin:0;flex:none}
label.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:var(--fs-md)}
.lbl{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--text-2);margin-bottom:3px}
.campo-ajuda{font-size:var(--fs-xs);color:var(--text-2);margin-top:4px}
.campo-erro{font-size:var(--fs-xs);color:var(--bad-fg);margin-top:4px;display:flex;gap:5px;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}
input[type=file]{font-size:var(--fs-sm);color:var(--text-2);max-width:100%}input[type=file]::file-selector-button{border:1px solid var(--soft-br);background:var(--soft);color:var(--soft-fg);border-radius:var(--r-sm);padding:6px 12px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer}input[type=file]::file-selector-button:hover{background:var(--soft-2)}.busca{position:relative}
.busca .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.busca input{padding-left:32px}

/* Campos de cópia (dados do pedido) */
.cp-grupo{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:8px 12px}
.cp-grupo + .cp-grupo{margin-top:10px}
.cp-grupo > .eyebrow{display:block;margin-bottom:8px}
.cp-linha{display:grid;grid-template-columns:minmax(140px,180px) 1fr;gap:4px 12px;align-items:start;padding:4px 0}
.cp-linha + .cp-linha{border-top:1px dashed var(--border)}
@media (max-width:640px){.cp-linha{grid-template-columns:1fr}}
.cp-linha > .rot{font-size:var(--fs-sm);font-weight:600;color:var(--text);padding-top:7px}
.cp-linha > .rot small{display:block;font-weight:400;color:var(--text-2);font-size:var(--fs-xs)}
.cp-campos{display:flex;flex-wrap:wrap;gap:8px}
.cp-campo{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.cp-campo.curto{flex:0 1 190px}.cp-campo.mid{flex:0 1 290px}
.cp-campo .wrapin{flex:1;min-width:0}
.cp-campo .sub{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-bottom:2px}

/* ===== Estado vazio ===== */
.vazio{border:2px dashed var(--soft-br);border-radius:var(--r-lg);padding:44px 20px;text-align:center;background:var(--surface);transition:.15s}
.vazio.sobre{border-color:var(--focus);background:var(--accent-bg)}
.vazio .ico{width:56px;height:56px;border-radius:14px;background:var(--soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
:root[data-theme=dark] .vazio .ico{color:var(--soft-fg)}
.vazio h2{font-size:var(--fs-lg);font-weight:700;color:var(--soft-fg);margin-bottom:4px}
.vazio p{color:var(--text-2);font-size:var(--fs-sm);margin:0 auto 16px;max-width:620px}

/* ===== Etiquetas / selos (nunca só cor: sempre texto ou ícone) ===== */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:650;line-height:1;border-radius:6px;padding:4px 8px;background:var(--neu-bg);color:var(--neu-fg);border:1px solid var(--neu-br);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-br)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-br)}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-br)}
.tag.obs{background:var(--obs-bg);color:var(--obs-fg);border-color:var(--obs-br)}
.tag.info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-br)}
.tag.ac{background:var(--accent-bg);color:var(--accent-fg);border-color:var(--accent-br)}
.tag.id{background:var(--c-bg);color:var(--c-fg);border-color:var(--c-br)}
.tag.solid-ok{background:var(--ok-solid);color:#fff;border-color:var(--ok-solid)}

/* ===== E-mail recebido ===== */
.email-meta{display:grid;grid-template-columns:84px 1fr;gap:5px 12px;font-size:var(--fs-sm);margin-bottom:12px}
.email-meta dt{color:var(--text-2);font-weight:600}
.email-meta dd{margin:0;word-break:break-word}
pre.original{white-space:pre-wrap;word-break:break-word;font-family:var(--font-sans);font-size:var(--fs-sm);line-height:1.55;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin:0;max-height:62vh;overflow:auto}
pre.original .hist{color:var(--text-3)}
mark{border-radius:3px;padding:0 3px;color:inherit}
mark.m-ok{background:var(--mark-ok)}
mark.m-warn{background:var(--mark-warn)}
mark.m-cart{background:var(--mark-cart)}
mark.lacuna{background:var(--warn-bg);color:var(--warn-fg);outline:1px dashed var(--warn-br)}

/* ===== Alertas ===== */
.card.painel-al{padding:0;overflow:hidden}
.painel-al .al-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);border-left:4px solid var(--border-strong)}
.painel-al.tem-bloqueio .al-h{border-left-color:var(--bad-solid);background:var(--bad-bg)}
.painel-al .al-h h2{font-size:var(--fs-md);font-weight:700;color:var(--text)}
.painel-al.tem-bloqueio .al-h h2{color:var(--bad-fg)}
.painel-al .al-corpo{padding:12px 16px}
.alertas{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border-radius:var(--r-sm);padding:9px 12px;font-size:var(--fs-sm);border:1px solid var(--border);border-left-width:4px;background:var(--surface)}
.al .tx{min-width:0;overflow-wrap:anywhere}
.al.bloqueio{background:var(--bad-bg);border-color:var(--bad-br);border-left-color:var(--bad-solid);color:var(--bad-fg)}
.al.obs{background:var(--obs-bg);border-color:var(--obs-br);border-left-color:var(--obs-solid);color:var(--obs-fg)}
.al.atencao{background:var(--warn-bg);border-color:var(--warn-br);border-left-color:var(--warn-solid);color:var(--warn-fg)}
.ult-guia{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);color:var(--info-fg);border:1px solid var(--info-br);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:var(--fs-sm)}
.ult-guia .eyebrow{color:var(--info-fg)}.ult-linha{margin-top:2px}
.painel-al.compacto .al-h{padding:6px 12px}.painel-al.compacto .al-h h2{font-size:var(--fs-sm)}.painel-al.compacto .al-corpo{padding:8px 12px}
.painel-al.compacto .alertas{gap:4px}
.painel-al.compacto .al{padding:5px 9px;font-size:var(--fs-xs);grid-template-columns:auto 1fr;gap:2px 8px;line-height:1.35}
.painel-al.compacto .al .tag{font-size:10.5px;padding:2px 6px}
.painel-al.compacto .al .al-t{font-weight:700}
.al .acoes-al{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.al .acoes-al .btn.sm{min-height:24px;font-size:11px;padding:0 8px}
label.chk.conferi{font-size:var(--fs-xs);font-weight:650;align-items:center;gap:5px}
.al-infos{margin-top:6px}.al-infos summary{font-size:var(--fs-xs);color:var(--text-2);font-weight:600}
.al-infos .alertas{margin-top:4px}
.quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.quadro{grid-template-columns:1fr}}
.col-q{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px}
.col-q h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:var(--fs-md)}
.card-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.card-q .t1{font-weight:650;font-size:var(--fs-sm)}
.al.atencao.conferido{background:var(--ok-bg);border-color:var(--ok-br);border-left-color:var(--ok-solid);color:var(--ok-fg)}
.al.atencao.conferido .tag{opacity:.75}
.al.info{background:var(--surface-2);border-color:var(--border);border-left-color:var(--text-3);color:var(--text-2)}
.al .acoes-al{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--text)}
.al .acoes-al select{width:auto;min-width:220px;min-height:var(--h-sm);padding:2px 8px;font-size:var(--fs-xs)}
.al .tag{background:transparent}

/* ===== Tabelas (cabeçalho azul, grade fina) ===== */
.tabela-scroll{overflow:auto;max-height:64vh;border-radius:var(--r-sm)}
table.t{border-collapse:collapse;width:100%}
.t th,.t td{text-align:left;padding:4px 7px;border:1px solid var(--grid);vertical-align:middle;font-size:var(--fs-sm)}
.t th{font-weight:700;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em;background:var(--th);color:var(--on-th);text-align:center;position:sticky;top:0;z-index:1}
.t td.pri{background:var(--soft);color:var(--soft-fg);font-weight:650}
.t td.c,.t th.c{text-align:center}
.t tr.novo td{background:var(--accent-bg)}
.qtd{font-size:var(--fs-lg);font-weight:750;color:var(--accent-fg);font-variant-numeric:tabular-nums}
@keyframes arco{to{background-position:200% 0}}
.qtd.multi{display:inline-block;font-size:26px;font-weight:900;line-height:1.1;padding:0 4px;background:linear-gradient(90deg,#ff1744,#ff9100,#ffea00,#00e676,#00b0ff,#d500f9,#ff1744);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:arco 1.6s linear infinite;filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 0 2px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:reduce){.qtd.multi{animation:none}}
.cod{font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.t-celula{display:flex;align-items:center;gap:8px;justify-content:center}

/* ===== Conferência cega ===== */
.cega{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.cega-linhas{display:grid;grid-template-columns:60px 170px 110px;gap:8px 12px;align-items:center;margin-top:12px}
.cega-linhas{max-width:100%}@media (max-width:420px){.cega-linhas{grid-template-columns:40px minmax(0,1fr) 70px;gap:8px}}
.cega-linhas input{min-width:0;font-size:var(--fs-lg);text-align:center;font-variant-numeric:tabular-nums}
.cega-linhas .h{font-size:var(--fs-xs);color:var(--text-2);text-transform:uppercase;font-weight:700}
.res-ok{display:flex;gap:8px;align-items:center;background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-br);border-radius:var(--r-sm);padding:10px 12px;font-weight:600}
.res-bad{background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad-br);border-radius:var(--r-sm);padding:10px 12px}
.res-bad ul{margin:6px 0 0;padding-left:20px;color:var(--text)}

/* ===== Finalização ===== */
.sit-opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sit{position:relative;display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:var(--r);padding:8px 12px;cursor:pointer;color:var(--text)}
.sit:hover{border-color:var(--border-strong);background:var(--surface-2)}
.sit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sit b{display:block;font-size:var(--fs-md)}
.sit small{display:block;color:var(--text-2);font-size:var(--fs-xs);margin-top:2px}
.sit .ic{margin-top:2px}
.sit.on.autorizada{border-color:var(--ok-solid);background:var(--ok-bg)}
.sit.on.parcial{border-color:var(--warn-solid);background:var(--warn-bg)}
.sit.on.nao{border-color:var(--bad-solid);background:var(--bad-bg)}
.sit.on .ic{color:currentColor}
.negados{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--soft);color:var(--soft-fg);padding:5px 16px;font-size:var(--fs-sm);font-weight:650;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button:hover{background:var(--soft-2)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.negado{display:grid;grid-template-columns:auto 1fr minmax(180px,260px);gap:10px;align-items:center;padding:9px 12px}
.negado + .negado{border-top:1px solid var(--border)}
.negado.on{background:var(--bad-bg)}
.negado.gl.on{background:var(--warn-bg)}
@media (max-width:700px){.negado{grid-template-columns:auto 1fr}.negado select{grid-column:1/-1}}
.rodape-guia{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== Painel do dia ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border-top:3px solid var(--border-strong)}
.kpi b{display:block;font-size:var(--fs-2xl);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:var(--fs-xs);color:var(--text-2);font-weight:600}
.kpi.ok{border-top-color:var(--ok-solid)}.kpi.warn{border-top-color:var(--warn-solid)}.kpi.bad{border-top-color:var(--bad-solid)}.kpi.info{border-top-color:var(--info-solid)}.kpi.ac{border-top-color:var(--accent-400)}.kpi.obs{border-top-color:var(--obs-solid)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.barra-clinica{display:grid;grid-template-columns:minmax(140px,240px) 1fr auto;gap:10px;align-items:center;padding:4px 0}
.barra-clinica .trilho{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.barra-clinica .trilho i{display:block;height:100%;background:var(--c-solid);border-radius:5px}
.proximo{font-size:var(--fs-xs);color:var(--text-2)}

/* ===== Modais ===== */
.modal-fundo{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.4);width:100%;max-width:860px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.modal.g{max-width:1024px}.modal.p{max-width:640px}
.modal-h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--brand-800);color:#fff}
:root[data-theme=dark] .modal-h{background:#1d3150}
.modal-h .caixa{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.modal-h h2{font-size:var(--fs-lg);font-weight:700;color:#fff;line-height:1.25}
.modal-h p{font-size:var(--fs-sm);color:var(--brand-200);margin-top:1px}
.modal-h .btn{margin-left:auto;background:transparent;border-color:transparent;color:#fff}
.modal-h .btn:hover{background:rgba(255,255,255,.15)}
.modal-b{padding:16px 18px;overflow:auto;flex:1}
.modal-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.modal-f .dica{margin:0;flex:1;min-width:180px}

/* ===== Editor de texto rico e modelos ===== */
.ed-barra{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border:1px solid var(--border-strong);border-bottom:0;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2)}
.ed-barra .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.ed-barra .btn{min-height:30px;padding:0 9px}
.ed-barra .btn.on{background:var(--soft-2);border-color:var(--soft-br)}
.ed-cores{display:inline-flex;gap:4px;align-items:center}
.ed-cor{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--border-strong);cursor:pointer;padding:0}
.ed-cor:hover{outline-color:var(--text)}
.ed-cor:focus-visible{outline:2px solid var(--focus)}
.ed{min-height:200px;max-height:55vh;overflow:auto;border:1px solid var(--border-strong);border-radius:0 0 var(--r-sm) var(--r-sm);padding:12px 14px;background:var(--field);font-size:var(--fs-md);line-height:1.6;outline:none}
.ed.solo{border-radius:var(--r-sm)}
.ed:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.ed p{margin:0 0 .75em}.ed ul,.ed ol{margin:0 0 .75em;padding-left:24px}
.tok{display:inline-block;background:var(--accent-bg);color:var(--accent-fg);border:1px solid var(--accent-br);border-radius:6px;padding:0 6px;font-size:.92em;font-weight:600;line-height:1.5;white-space:nowrap;user-select:all}
.tok.desc{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-br)}
.previa{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);overflow:hidden}
.previa-h{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-3)}
.previa-c{padding:14px 16px;font-size:var(--fs-md);line-height:1.6;overflow-wrap:anywhere;max-height:50vh;overflow:auto}
.previa-c p{margin:0 0 .75em}.previa-c ul,.previa-c ol{margin:0 0 .75em;padding-left:24px}
pre.simples{white-space:pre-wrap;font-family:var(--font-sans);margin:0}
.campos-cat{border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;background:var(--surface)}
.campos-cat > summary{cursor:pointer;padding:9px 12px;font-weight:650;font-size:var(--fs-sm);color:var(--soft-fg);list-style:none;display:flex;align-items:center;gap:8px}
.campos-cat > summary::-webkit-details-marker{display:none}
.campos-cat > summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:rotate(45deg);transition:.15s}
.campos-cat[open] > summary::after{transform:rotate(-135deg)}
.campo-it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 12px;border-top:1px solid var(--border)}
.campo-it b{font-size:var(--fs-sm)}
.campo-it .d{font-size:var(--fs-xs);color:var(--text-2);grid-column:1}
.campo-it .ex{font-size:var(--fs-xs);color:var(--text-2);grid-column:1}
.campo-it .ex code{background:var(--surface-3);border-radius:4px;padding:1px 5px;font-family:var(--font-sans);color:var(--text)}
.campo-it .btn{grid-row:1/4;grid-column:2;align-self:center}
.modelo-lista{display:flex;flex-direction:column;gap:4px}
.modelo-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--text)}
.modelo-item:hover{background:var(--surface-2)}
.modelo-item.ativa{background:var(--soft);border-color:var(--soft-br)}
.modelo-item b{font-size:var(--fs-sm)}
.modelo-item small{font-size:var(--fs-xs);color:var(--text-2)}
.modelo-item:focus-visible{outline:2px solid var(--focus)}
.aviso-simples{display:flex;gap:8px;align-items:flex-start;background:var(--info-bg);color:var(--info-fg);border:1px solid var(--info-br);border-radius:var(--r-sm);padding:9px 12px;font-size:var(--fs-sm)}

/* ===== Configurações ===== */
.cfg{display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:900px){.cfg{grid-template-columns:1fr}}
.cfg-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;padding:8px}
@media (max-width:900px){.cfg-nav{position:static;flex-direction:row;overflow-x:auto}.cfg-nav button{white-space:nowrap}}
.cfg-nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:var(--r-sm);padding:8px 10px;font-size:var(--fs-sm);font-weight:600;line-height:1.25;color:var(--text-2);cursor:pointer;text-align:left;white-space:normal;overflow-wrap:anywhere}
.cfg-nav button:hover{background:var(--surface-2);color:var(--text)}
.cfg-nav button.ativo{background:var(--soft);color:var(--soft-fg)}
.cfg-nav button:focus-visible{outline:2px solid var(--focus)}
.cfg-barra{position:sticky;bottom:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.cfg-barra .esp{flex:1}
.erros-cfg{background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad-br);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;font-size:var(--fs-sm)}
.erros-cfg ul{margin:6px 0 0;padding-left:20px}
.mestre{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.mestre{grid-template-columns:1fr}}
.lista-cl{max-height:66vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:10px}
.cl-item{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:8px 10px;text-align:left;cursor:pointer;color:var(--text)}
.cl-item:hover{background:var(--surface-2)}
.cl-item.ativa{background:var(--soft);border-color:var(--soft-br)}
.cl-item:focus-visible{outline:2px solid var(--focus)}
.cl-item .n{font-size:var(--fs-sm);font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.cl-item .s{font-size:var(--fs-xs);color:var(--text-2)}
.chips-e{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip-e{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--border);border-radius:999px;padding:3px 4px 3px 10px;font-size:var(--fs-sm)}
.chip-e button{border:0;background:transparent;color:var(--text-2);cursor:pointer;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.chip-e button:hover{background:var(--bad-bg);color:var(--bad-fg)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c-solid);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.sw button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.sw button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.av-op{display:flex;flex-wrap:wrap;gap:6px}
.av-op button{width:46px;height:46px;border-radius:50%;border:2px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.av-op button:hover{background:var(--surface-3)}
.av-op button.on{border-color:var(--primary);background:var(--soft);color:var(--soft-fg)}
.av-op button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.op-card.trancado{opacity:.85}
.cor-linha{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cor-linha input[type=color]{width:46px;height:34px;padding:2px;min-height:0;cursor:pointer}
.cor-linha input[type=range]{width:160px;min-height:0;padding:0}
.op-card{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:var(--surface-2)}
.op-card + .op-card{margin-top:10px}
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.modo-card{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);font-size:var(--fs-sm)}
.modo-card b{display:flex;gap:6px;align-items:center;margin-bottom:3px}
.al-cfg{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.al-cfg .topo-al{display:grid;grid-template-columns:1fr minmax(190px,230px);gap:6px 14px;align-items:center}
@media (max-width:700px){.al-cfg .topo-al{grid-template-columns:1fr}}
.al-cfg .n{font-weight:650;font-size:var(--fs-sm)}.al-cfg .d{font-size:var(--fs-xs);color:var(--text-2)}
.al-cfg .extra{margin-top:8px;display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:8px 14px}
@media (max-width:700px){.al-cfg .extra{grid-template-columns:1fr}}
.switch{display:flex;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:6px 14px;font-size:var(--fs-sm)}
.kv dt{color:var(--text-2);font-weight:600}.kv dd{margin:0}

.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-br);color:var(--warn-fg);border-radius:var(--r);padding:10px 14px;font-size:var(--fs-sm)}
.aviso .acoes{margin:0 0 0 auto}
.ultimo{display:flex;gap:10px;align-items:center;background:var(--ok-bg);border:1px solid var(--ok-br);color:var(--ok-fg);border-radius:var(--r);padding:10px 14px;font-size:var(--fs-sm)}
.banner-param{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--accent-bg);border:1px solid var(--accent-br);color:var(--accent-fg);border-radius:var(--r);padding:10px 14px;font-size:var(--fs-sm)}
.banner-param .esp{flex:1;min-width:200px}
details summary{cursor:pointer;color:var(--accent);font-weight:650}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-800);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:550;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;display:flex;gap:8px;align-items:center}
:root[data-theme=dark] .toast{background:#2b4468}
.toast.vis{opacity:1}
.toast.bad{background:var(--bad-solid)}
/* ===== Rodapé ===== */
footer.rodape{width:100%;max-width:1600px;margin:0 auto;border-top:1px solid var(--border);padding:16px 12px;font-size:var(--fs-sm);color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
@media (min-width:640px){footer.rodape{flex-direction:row;justify-content:space-between;padding:16px 24px}}
footer.rodape b{font-weight:650;color:var(--soft-fg)}
footer.rodape .ver{font-size:var(--fs-xs);color:var(--text-3);margin-left:6px}
.print-head{display:none}
/* ===== Impressão: A4 paisagem, sem topo, barras, botões e campos ===== */
@page{size:A4 landscape;margin:7mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;color:#000}
  header.topo,nav.abas,.btn,.chip,input,select,.toast,.passos,.acoes,.guias-bar,.modal-fundo,.cfg-barra{display:none!important}
  .print-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #2c4a70;padding-bottom:6px;margin-bottom:8px}
  .print-head img{height:10mm}
  .print-head b{font-size:14px;font-weight:800;color:#2c4a70}
  .print-head span{color:#17786b;font-weight:700}
  .print-head small{margin-left:auto;font-size:9px;color:#6b7280}
  .card{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Largura mínima (320px): nada pode forçar rolagem horizontal da página */
main,.card,.card-h,.email-meta dd,.cp-campos,.form-grid>*,.grid2>*{min-width:0}
.card-h{flex-wrap:wrap}
.email-meta dd,.email-meta dd .num{overflow-wrap:anywhere}
pre.original,pre.simples{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){.btn{white-space:normal;max-width:100%;text-align:left;padding-top:5px;padding-bottom:5px}.btn.so{text-align:center}.linha-flex{flex-wrap:wrap}.email-meta{grid-template-columns:1fr}.email-meta dt{margin-top:4px}}
</style>
</head>
